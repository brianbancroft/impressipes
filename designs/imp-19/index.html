<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Impressipies illustrations and empty states (IMP-19)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap');
@page { size: 1760px 1080px; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #e9e4de; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* tokens (IMP-14) */
.light {
  --bg:#FFF8F0; --surface:#FFFFFF; --surface-2:#FBEFE2; --line:#EADBCB; --ink:#2B2118; --ink-muted:#6B5D50;
  --accent:#C62F55; --on-accent:#FFFFFF; --accent-soft:#FCE4EA; --success:#1F6B45; --warning:#8A5A00; --danger:#B3261E; --info:#2455B0;
  --tomato:#B83A2B; --sky:#3C8DE0; --leaf:#5E9626; --violet:#8E4CC0; --tangerine:#E0701A; --teal:#0E7C86;
  --berry:#C42A7B; --mustard:#8A6A00; --indigo:#3D3FA8; --cocoa:#7A4A2E; --forest:#1F6B45; --slate:#7E8896;
  --shadow: 0 1px 2px rgba(43,33,24,.08), 0 6px 16px rgba(43,33,24,.06);
  --scrim: rgba(43,33,24,.42);
}
.dark {
  --bg:#1A1512; --surface:#2A221D; --surface-2:#342B24; --line:#43372E; --ink:#F7EEE4; --ink-muted:#BDAE9F;
  --accent:#FF8DA5; --on-accent:#2B0A12; --accent-soft:#4A2230; --success:#5BD39A; --warning:#E5B93C; --danger:#FF8A80; --info:#8FB4FF;
  --tomato:#FF7A66; --sky:#7DB8FF; --leaf:#9BD65F; --violet:#C79BF2; --tangerine:#FFA24F; --teal:#4FD0D6;
  --berry:#FF7DB8; --mustard:#CFA52E; --indigo:#8F94F5; --cocoa:#B58059; --forest:#5BD39A; --slate:#A5B0BD;
  --shadow: none; --scrim: rgba(0,0,0,.6);
}
:root { --display: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }


/* presentation pages */
.page { width:1760px; height:1080px; padding:40px 56px; page-break-after:always; break-after:page; background:#e9e4de; position:relative; overflow:hidden; }
.page > h1 { font:800 28px var(--display); margin:0 0 4px; color:#2B2118; }
.page > .sub { font:500 15px system-ui; color:#6B5D50; margin:0 0 18px; max-width:1500px; line-height:1.4; }
.frames { display:flex; gap:40px; align-items:flex-start; }
.cap { font:600 13px ui-monospace, Menlo, monospace; color:#6B5D50; margin-top:8px; }
.cap b { color:#2B2118; }
.spec { display:grid; grid-template-columns:1fr 1fr 1fr; gap:28px; margin-top:8px; }
.spec section { background:#fff8f0; border:1px solid #eadbcb; border-radius:20px; padding:22px 24px; }
.spec h3 { font:800 18px var(--display); margin:0 0 10px; color:#2B2118; }
.spec ul { margin:0; padding-left:18px; font:400 14px/1.5 system-ui; color:#2B2118; }
.spec li { margin-bottom:6px; }
.spec code { font:600 12.5px ui-monospace, Menlo, monospace; background:#fbefe2; padding:1px 5px; border-radius:5px; }
.sw { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px; }
.sw span { width:26px; height:26px; border-radius:50%; display:block; }


/* iOS screen shells, from designs/imp-16 (scoped to .ios) */
.ios {
/* device */
.phone { width:393px; height:852px; border-radius:48px; overflow:hidden; position:relative; background:var(--bg); color:var(--ink); border:1px solid rgba(0,0,0,.18); box-shadow:0 12px 30px rgba(43,33,24,.18); font-size:calc(17px * var(--dt,1)); line-height:1.25; }
.dark.phone { border-color:#000; }
.status { height:54px; padding:18px 30px 0; display:flex; justify-content:space-between; font:600 16px system-ui; position:relative; z-index:5; }
.status .r { display:flex; gap:6px; align-items:center; }
.island { position:absolute; left:50%; top:11px; width:122px; height:35px; background:#000; border-radius:20px; transform:translateX(-50%); }
.home { position:absolute; bottom:8px; left:50%; width:136px; height:5px; border-radius:3px; background:var(--ink); transform:translateX(-50%); opacity:.9; z-index:9; }
.screen { position:absolute; inset:54px 0 0 0; overflow:hidden; }
.scroll { padding:0 16px; }

/* typography (Dynamic Type) */
.t-large { font:800 calc(34px*var(--dt,1))/1.1 var(--display); letter-spacing:.2px; }
.t-title { font:800 calc(28px*var(--dt,1))/1.15 var(--display); }
.t-head  { font:600 calc(17px*var(--dt,1))/1.25 system-ui; }
.t-body  { font:400 calc(17px*var(--dt,1))/1.25 system-ui; }
.t-cap   { font:500 calc(12px*var(--dt,1))/1.25 system-ui; color:var(--ink-muted); }
.muted { color:var(--ink-muted); }

/* nav */
.nav { height:44px; padding:0 8px; display:flex; align-items:center; justify-content:space-between; color:var(--accent); font:400 17px system-ui; }
.nav .mid { color:var(--ink); font:800 17px var(--display); display:flex; gap:6px; align-items:center; }
.nav .nb { display:flex; align-items:center; gap:2px; min-width:70px; height:44px; }
.nav .nb.r { justify-content:flex-end; }
.titlebar { padding:4px 16px 12px; display:flex; justify-content:space-between; align-items:center; }
.plus-btn { width:44px; height:44px; border-radius:22px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; margin-right:-4px; }

/* tab bar */
.tabbar { position:absolute; left:0; right:0; bottom:0; height:84px; background:var(--surface); border-top:1px solid var(--line); display:flex; padding:8px 12px 0; z-index:6; }
.tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font:600 10.5px system-ui; color:var(--ink-muted); }
.tab.on { color:var(--accent); }
.tab svg { width:26px; height:26px; }

/* list home row */
.lrow { background:var(--surface); border:1px solid var(--line); border-radius:12px; min-height:calc(52px); margin-bottom:6px; padding:10px 12px 10px 0; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow); overflow:hidden; }
.lrow .dot { width:5px; align-self:stretch; border-radius:0 3px 3px 0; margin:-10px 0; }
.lrow .em { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-size:22px; flex:none; }
.lrow .txt { flex:1; min-width:0; }
.lrow .name { font:800 calc(17px*var(--dt,1))/1.2 var(--display); }
.lrow .act { display:flex; align-items:center; gap:6px; margin-top:3px; }
.count { font:700 calc(13px*var(--dt,1)) var(--display); padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--ink); white-space:nowrap; }
.count.done { background:transparent; color:var(--success); display:flex; align-items:center; gap:4px; padding:3px 0; }
.chev { color:var(--ink-muted); opacity:.7; }

/* avatars */
.av { border-radius:50%; display:grid; place-items:center; font:800 12px var(--display); color:var(--surface); flex:none; }
.av.s24 { width:24px; height:24px; font-size:12px; } .av.s32 { width:32px; height:32px; font-size:14px; } .av.s44 { width:44px; height:44px; font-size:18px; }
.stack { display:flex; } .stack .av { box-shadow:0 0 0 2px var(--surface); margin-left:-8px; } .stack .av:first-child { margin-left:0; }

/* add bar */
.addbar { margin:0 16px 14px; height:48px; border-radius:12px; background:var(--surface-2); display:flex; align-items:center; padding:0 14px; gap:10px; color:var(--ink-muted); font:400 calc(17px*var(--dt,1)) system-ui; }
.addbar .pl { color:var(--accent); }

/* category header */
.cat { height:36px; border-radius:8px; margin:16px 16px 6px; position:relative; display:flex; align-items:center; padding:0 12px 0 14px; gap:8px; background:color-mix(in srgb, var(--c) 16%, var(--surface)); overflow:hidden; }
.cat:first-of-type { margin-top:0; }
.cat::before { content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--c); }
.cat .chip { width:22px; height:22px; border-radius:50%; background:var(--c); display:grid; place-items:center; font-size:12px; flex:none; }
.cat .lab { font:800 calc(13px*var(--dt,1))/1 var(--display); letter-spacing:.06em; text-transform:uppercase; color:var(--ink); flex:1; }
.cat .n { font:700 calc(13px*var(--dt,1)) var(--display); color:var(--ink-muted); }
.sub .cat { margin-left:0; margin-right:0; }

/* item row */
.row { margin:0 16px 6px; background:var(--surface); border:1px solid var(--line); border-radius:12px; min-height:52px; display:flex; align-items:center; padding:4px 12px 4px 0; gap:0; box-shadow:var(--shadow); }
.ring { width:44px; height:44px; display:grid; place-items:center; flex:none; }
.ring i { width:26px; height:26px; border-radius:50%; border:2.5px solid var(--c); display:grid; place-items:center; }
.ring.on i { background:var(--c); }
.ring.on svg { display:block; } .ring svg { display:none; }
.row .body { flex:1; min-width:0; padding:6px 8px 6px 2px; }
.row .nm { font:400 calc(17px*var(--dt,1))/1.25 system-ui; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.row.checked .nm { color:var(--ink-muted); text-decoration:line-through; text-decoration-thickness:1.5px; }
.row .meta { margin-top:2px; font:500 calc(12px*var(--dt,1)) system-ui; color:var(--ink-muted); display:flex; align-items:center; gap:6px; }
.qty { font:700 calc(13px*var(--dt,1)) system-ui; padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; flex:none; margin-right:8px; }
.dark .qty { color:var(--ink); }
.sync { display:flex; align-items:center; color:var(--warning); flex:none; margin-left:2px; }

/* got it */
.gotit { margin:12px 16px 0; display:flex; align-items:center; justify-content:space-between; min-height:44px; font:600 calc(15px*var(--dt,1)) system-ui; color:var(--ink-muted); }
.gotit .l { display:flex; align-items:center; gap:6px; }
.btn { height:44px; border-radius:22px; padding:0 18px; display:inline-flex; align-items:center; justify-content:center; font:700 calc(15px*var(--dt,1)) var(--display); background:var(--surface); color:var(--ink); border:1px solid var(--line); }
.btn.sm { height:36px; padding:0 14px; font-size:14px; }
.btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); height:50px; font-size:17px; }
.btn.danger { color:var(--danger); }

/* toast */
.toast { position:absolute; left:16px; right:16px; bottom:98px; border-radius:12px; padding:12px 14px; display:flex; align-items:center; gap:10px; background:color-mix(in srgb, var(--success) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--success) 35%, var(--line)); font:600 calc(15px*var(--dt,1)) system-ui; z-index:7; }
.toast .u { margin-left:auto; color:var(--accent); font:800 15px var(--display); }
.toast.warn { background:color-mix(in srgb, var(--warning) 12%, var(--surface)); border-color:color-mix(in srgb, var(--warning) 35%, var(--line)); }
.banner { margin:0 16px 12px; border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:10px; background:color-mix(in srgb, var(--warning) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--warning) 30%, var(--line)); font:500 calc(14px*var(--dt,1)) system-ui; }

/* empty */
.empty { text-align:center; padding:56px 40px 0; }
.empty .art { width:120px; height:120px; margin:0 auto 20px; border-radius:50%; background:var(--accent-soft); display:grid; place-items:center; font-size:56px; }
.empty h2 { font:800 calc(22px*var(--dt,1))/1.2 var(--display); margin:0 0 6px; }
.empty p { margin:0 0 22px; color:var(--ink-muted); font:400 calc(16px*var(--dt,1))/1.35 system-ui; }
.hint { margin:0 16px; padding:2px 4px; color:var(--ink-muted); font:400 calc(15px*var(--dt,1))/1.4 system-ui; }
.alldone { margin:8px 16px 0; padding:28px 16px; text-align:center; border-radius:20px; background:var(--surface); border:1px solid var(--line); }
.alldone .ck { width:56px; height:56px; border-radius:50%; background:color-mix(in srgb, var(--success) 14%, var(--surface)); display:grid; place-items:center; margin:0 auto 10px; color:var(--success); }
.alldone h2 { font:800 calc(20px*var(--dt,1)) var(--display); margin:0 0 4px; }
.alldone p { margin:0; color:var(--ink-muted); font:400 calc(15px*var(--dt,1)) system-ui; }

/* sheet */
.scrim { position:absolute; inset:0; background:var(--scrim); z-index:20; }
.sheet { position:absolute; left:0; right:0; top:92px; bottom:0; background:var(--surface); border-radius:20px 20px 0 0; z-index:21; padding:8px 16px 0; }
.dark .sheet { background:var(--surface-2); }
.grab { width:36px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px; }
.dark .grab { background:#6a5c50; }
.fieldrow { display:flex; align-items:center; gap:12px; }
.field { flex:1; height:52px; border-radius:12px; background:var(--surface-2); border:2px solid var(--accent); display:flex; align-items:center; padding:0 14px; font:400 calc(18px*var(--dt,1)) system-ui; }
.dark .field { background:var(--surface); }
.field.idle { border-color:transparent; color:var(--ink-muted); }
.caret { width:2px; height:22px; background:var(--accent); margin-left:1px; }
.done { color:var(--accent); font:800 17px var(--display); }
.guess { margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.guess .lbl { font:600 12px system-ui; color:var(--ink-muted); }
.pill { height:44px; border-radius:22px; padding:0 14px; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); font:700 14px var(--display); color:var(--ink); }
.dark .pill { background:var(--surface-2); }
.pill .d { width:10px; height:10px; border-radius:50%; background:var(--c); }
.pill.sel { background:color-mix(in srgb, var(--c) 16%, var(--surface)); border-color:var(--c); border-width:2px; }
.pill.q { background:var(--accent-soft); border-color:transparent; color:var(--accent); }
.dark .pill.q { color:var(--ink); }
.pills { display:flex; gap:8px; margin-top:10px; overflow:hidden; }
.sec { font:800 12px var(--display); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); margin:16px 2px 6px; }
.sug { height:52px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); font:400 calc(17px*var(--dt,1)) system-ui; }
.sug:last-child { border-bottom:0; }
.sug .em { font-size:20px; width:28px; text-align:center; }
.sug .sg { margin-left:auto; color:var(--ink-muted); font:500 13px system-ui; margin-right:4px; padding:0; max-width:none; }
.sug .pp { width:32px; height:32px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; }
.dark .sug .pp { color:var(--ink); }
.keyboard { position:absolute; left:0; right:0; bottom:0; height:300px; background:var(--kb); padding:8px 3px 0; z-index:22; }
.krow { display:flex; gap:6px; justify-content:center; margin-bottom:11px; }
.k { height:42px; flex:1; max-width:34px; border-radius:5px; background:var(--key); color:var(--keytext); display:grid; place-items:center; font:400 22px system-ui; box-shadow:0 1px 0 rgba(0,0,0,.3); }
.k.d { background:var(--keydark); } .k.w { max-width:none; flex:none; width:44px; } .k.sp { max-width:none; flex:1; font-size:16px; } .k.ret { max-width:none; flex:none; width:92px; font-size:16px; background:var(--accent); color:var(--on-accent); }

/* settings */
.grp { margin:0 16px 20px; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
.si { min-height:52px; display:flex; align-items:center; gap:12px; padding:8px 14px; border-top:1px solid var(--line); font:400 calc(17px*var(--dt,1)) system-ui; }
.si:first-child { border-top:0; }
.si .v { margin-left:auto; color:var(--ink-muted); display:flex; align-items:center; gap:6px; font-size:calc(16px*var(--dt,1)); text-align:right; }
.si .ic { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); flex:none; }
.dark .si .ic { color:var(--ink); }
.prof { padding:16px 14px; display:flex; gap:14px; align-items:center; }
.foot { text-align:center; color:var(--ink-muted); font:400 12px system-ui; margin-top:6px; }
.shead { font:800 12px var(--display); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); margin:0 32px 6px; }

}

/* web screen shells, from designs/imp-17 (scoped to .web) */
.web {
/* window (browser viewport) */
.win { position:relative; overflow:hidden; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.4; border:1px solid rgba(0,0,0,.16); border-radius:14px; box-shadow:0 12px 30px rgba(43,33,24,.16); }
.dark.win { border-color:#000; }
.phone { border-radius:28px; }
.sc { transform-origin:0 0; }

/* shared */
.disp { font-family:var(--display); }
.muted { color:var(--ink-muted); }
.btn { height:44px; border-radius:22px; padding:0 20px; display:inline-flex; align-items:center; justify-content:center; gap:8px; font:800 15px var(--display); background:var(--surface); color:var(--ink); border:1px solid var(--line); white-space:nowrap; cursor:pointer; }
.btn.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
.btn.danger { color:var(--danger); }
.btn.ghost { background:transparent; border-color:transparent; color:var(--accent); padding:0 12px; }
.btn.sm { height:36px; padding:0 14px; font-size:14px; }
.btn.icon { width:44px; padding:0; }
.btn.focus, .focus { outline:2px solid var(--accent); outline-offset:2px; }
.btn.disabled { opacity:.5; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); }
.input { height:44px; border-radius:12px; background:var(--surface-2); border:1px solid transparent; display:flex; align-items:center; gap:10px; padding:0 14px; font-size:16px; color:var(--ink); }
.input.ph { color:var(--ink-muted); }
.input.focus { outline:2px solid var(--accent); outline-offset:2px; }
.input.err { border:2px solid var(--danger); }
.help { font-size:13px; color:var(--ink-muted); margin-top:6px; }
.help.err { color:var(--danger); display:flex; gap:6px; align-items:center; }
.label { font:800 12px var(--display); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:8px; }
.chip { height:36px; border-radius:18px; padding:0 14px; display:inline-flex; align-items:center; gap:6px; font:700 14px var(--display); background:var(--surface); border:1px solid var(--line); color:var(--ink); white-space:nowrap; }
.chip.on { background:var(--accent-soft); border-color:var(--accent); color:var(--ink); }
.chip .n { color:var(--ink-muted); font-weight:700; }
.pill { height:26px; border-radius:13px; padding:0 10px; display:inline-flex; align-items:center; gap:5px; font:700 13px var(--display); white-space:nowrap; }
.pill.success { background:color-mix(in srgb, var(--success) 14%, var(--surface)); color:var(--ink); }
.pill.success svg { color:var(--success); }
.pill.warning { background:color-mix(in srgb, var(--warning) 14%, var(--surface)); color:var(--ink); }
.pill.warning svg { color:var(--warning); }
.pill.muted { background:var(--surface-2); color:var(--ink-muted); }
.pill.info { background:color-mix(in srgb, var(--info) 12%, var(--surface)); color:var(--ink); }
.pill.info svg { color:var(--info); }
.pill.acc { background:var(--accent-soft); color:var(--ink); }
.tag { height:24px; border-radius:12px; padding:0 10px; display:inline-flex; align-items:center; gap:5px; font:600 12px system-ui; background:color-mix(in srgb, var(--c) 16%, var(--surface)); color:var(--ink); }
.tag i { width:8px; height:8px; border-radius:50%; background:var(--c); }
.av { border-radius:50%; display:grid; place-items:center; font:800 12px var(--display); color:var(--surface); flex:none; }
.av.s24 { width:24px; height:24px; } .av.s32 { width:32px; height:32px; font-size:14px; } .av.s44 { width:44px; height:44px; font-size:18px; }
.stepper { display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border-radius:22px; padding:3px; }
.stepper b { min-width:32px; text-align:center; font:800 17px var(--display); }
.stepper .s { width:38px; height:38px; border-radius:50%; background:var(--surface); display:grid; place-items:center; border:1px solid var(--line); }
.check { width:24px; height:24px; border-radius:7px; border:2px solid var(--ink-muted); display:grid; place-items:center; flex:none; }
.check.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.toast { border-radius:12px; padding:12px 16px; display:flex; align-items:center; gap:10px; background:color-mix(in srgb, var(--success) 12%, var(--surface)); border:1px solid color-mix(in srgb, var(--success) 35%, var(--line)); font:600 15px system-ui; }
.toast .u { margin-left:auto; color:var(--accent); font:800 15px var(--display); padding-left:16px; }
.toast.info { background:color-mix(in srgb, var(--info) 12%, var(--surface)); border-color:color-mix(in srgb, var(--info) 35%, var(--line)); }
.scrim { position:absolute; inset:0; background:var(--scrim); z-index:20; }

// open questions
out.push(`<div class="page"><h1>Open questions</h1><p class="sub">Nothing here changes the IMP-14 tokens or IMP-15 components. These are the calls this ticket made that someone else may want to overrule.</p>
<div class="spec">
<section><h3>Decide</h3><ul>
<li><b>Empty list has a pie after all.</b> IMP-16 chose no illustration on the empty list so the add field stays prominent. Here the pie sits below the add bar. Watch it in IMP-12: do people still find the add bar unaided? Dropping the art is one flag.</li>
<li><b>Decorative or labelled?</b> Labels are specified. If VoiceOver users find “pie peeking out of an empty basket” noisy, mark the art decorative on empty list and all done and keep it on offline and error.</li>
<li><b>No semantic colours in artwork.</b> Error uses tomato, offline sky, done leaf, because the brief limits art to category colours. Tomato (<code>#B83A2B</code>) and danger (<code>#B3261E</code>) are close; confirm that is fine.</li>
<li><b>iPhone no-recipes action.</b> “Open on the web” assumes iPhone is read and cook only (IMP-11, I9). Needs a link target, or the action becomes “Connect your AI” if that ships on iPhone.</li>
<li><b>Web offline.</b> Assumes recipes are not cached for offline. If they are, the offline card only shows before the first load.</li></ul></section>
<section><h3>Check on devices</h3><ul>
<li>Glyph legibility at 40 pt on a 41 mm watch (simulated here only).</li>
<li>Light-mode sky (3.1:1) and leaf (3.2:1) shapes on <code>surface-2</code> in sunlight; they carry no meaning alone, so this is a polish check.</li>

// handoff
out.push(`<div class="page"><h1>Handoff: exporting the SVGs for the apps</h1><p class="sub">The single source is <code>designs/imp-19/index.html</code>: <code>pie()</code>, <code>SCENES</code> and <code>COPY</code>. Do not redraw in another tool; generate from it.</p>
<div class="spec">
<section><h3>Files to produce</h3><ul>
<li>5 scenes × 2 appearances: <code>illo-empty-list-light.svg</code>, <code>-dark.svg</code>, then <code>all-done</code>, <code>no-recipes</code>, <code>offline</code>, <code>error</code>. “No lists yet” reuses empty-list.</li>
<li>5 mascot faces × 2: <code>pie-hello</code>, <code>happy</code>, <code>sleepy</code>, <code>dizzy</code>, <code>curious</code>, and the 124-wide glyph set <code>pie-mini-*</code> for watch.</li>
<li>Scenes: <code>viewBox="0 0 200 170"</code>. Mascot: <code>36 18 128 140</code>. Glyph: <code>38 28 124 124</code>. No width or height attribute.</li>
<li>Each file is flat: paths, circles, rects, ellipses and groups with stable ids <code>pie crust filling face prop sparkle</code>. No text, filters, gradients, masks, clip-paths or CSS.</li>
<li>Opacity only through <code>fill-opacity</code> / <code>stroke-opacity</code>. Strokes use round caps and joins.</li></ul></section>
<section><h3>Per platform</h3><ul>
<li><b>Web:</b> inline SVG in a component (<code>&lt;Illustration name="error" /&gt;</code>), not <code>&lt;img&gt;</code>, with colours as <code>var(--color-cat-mustard)</code> etc. The IMP-14 theme attribute recolours it; no dark file. <code>role="img"</code> and <code>aria-label</code> from <code>COPY</code>; <code>aria-hidden</code> if the open question lands on decorative.</li>
<li><b>iOS:</b> one Image Set per illustration in <code>Illustrations.xcassets</code>, appearances Any and Dark, Preserve Vector Data on, Render As Original, Scales Single. Names <code>Illustration/EmptyList</code> and so on. Hex values are resolved from the IMP-14 Color Sets at export time, not hand-picked. Label via <code>.accessibilityLabel</code>.</li>
<li><b>watchOS:</b> dark files only, in the watch asset catalog, and only the glyph set (<code>pie-mini-*</code>); the scenes are not used on the watch.</li>
<li><b>Android or email:</b> not in scope.</li></ul></section>
<section><h3>How to generate</h3><ul>
<li>Add a small Node script in the build tickets that evaluates the generators, substitutes each <code>var(--name)</code> with the light or dark hex from the IMP-14 table, and writes the files above. Run it in CI so exports never drift from tokens.</li>
<li>For web, the same script outputs the unresolved <code>var(--color-*)</code> version, renaming <code>--mustard</code> to <code>--color-cat-mustard</code>, <code>--accent</code> to <code>--color-accent</code> and so on.</li>
<li>Check after export: opens in Preview and Chrome, SwiftUI <code>Image("…")</code> renders in light and dark previews, file size under 4 KB each, contrast of every shape at least 3:1 against <code>bg</code>.</li>
<li>Text version of these decisions is on the Notion Designs page beside the PDF.</li>
<li>Dependent: IMP-18 (idle motion), IMP-20 (watch, Smart Stack), build tickets for list, recipe and sync states.</li></ul></section>
</div></div>`);
