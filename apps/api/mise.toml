[tools]
go = "1.26"

[env]
PORT = "8080"

[tasks.dev]
description = "Run the API"
run = "go run ./cmd/api"

[tasks.build]
description = "Build the API binary into dist/"
run = "go build -o ../../dist/apps/api/api ./cmd/api"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.sqlc]
description = "Regenerate the sqlc data-access code from internal/db"
run = "go tool sqlc generate"
