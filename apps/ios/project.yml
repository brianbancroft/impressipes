name: Impressipies
options:
  bundleIdPrefix: ca.brianbancroft
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
fileGroups:
  - project.yml
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
packages:
  ApiClient:
    path: ../../libs/api-spec/swift
targets:
  # The Shared/ folder (API client wrapper, models, keychain, watch context) plays the role of
  # ImpressipiesKit: it is compiled into both apps rather than built as a separate module.
  Impressipies:
    type: application
    platform: iOS
    sources:
      - path: Impressipies
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: ApiClient
      - target: ImpressipiesWatch
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.brianbancroft.impressipies
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Impressipes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    scheme:
      testTargets:
        - ImpressipiesTests
  ImpressipiesWatch:
    type: application
    platform: watchOS
    sources:
      - path: ImpressipiesWatch
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: ApiClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.brianbancroft.impressipies.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Impressipes
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: ca.brianbancroft.impressipies
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
  ImpressipiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ImpressipiesTests
    dependencies:
      - target: Impressipies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.brianbancroft.impressipies.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Impressipies.app/Impressipies
        BUNDLE_LOADER: $(TEST_HOST)
