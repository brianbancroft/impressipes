name: Impressipies
options:
  bundleIdPrefix: ca.brianbancroft
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
fileGroups:
  - project.yml
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
packages:
  ApiClient:
    path: ../../libs/api-spec/swift
targets:
  # The Shared/ folder (API client wrapper, models, keychain, watch context) plays the role of
  # ImpressipiesKit: it is compiled into both apps rather than built as a separate module.
  Impressipies:
    type: application
    platform: iOS
    sources:
      - path: Impressipies
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: ApiClient
      - target: ImpressipiesWatch
        embed: true
        codeSign: false
    # applinks lets the emailed sign-in link (https://impressipes.bancroft.io/auth/verify) open the app;
    # webcredentials lets the app use the site's passkeys. The server must serve
    # /.well-known/apple-app-site-association (set APPLE_TEAM_ID there). applesignin enables Sign in with Apple.
    entitlements:
      path: Impressipies.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:impressipes.bancroft.io
          - webcredentials:impressipes.bancroft.io
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.brianbancroft.impressipies
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Impressipes
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Impressipes uses the camera to scan the QR code that sets your server address.
    scheme:
      testTargets:
        - ImpressipiesTests
  ImpressipiesWatch:
    type: application
    platform: watchOS
    sources:
      - path: ImpressipiesWatch
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    dependencies:
      - package: ApiClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.brianbancroft.impressipies.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Impressipes
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: ca.brianbancroft.impressipies
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
  ImpressipiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ImpressipiesTests
    dependencies:
      - target: Impressipies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.brianbancroft.impressipies.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Impressipies.app/Impressipies
        BUNDLE_LOADER: $(TEST_HOST)
