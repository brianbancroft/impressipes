openapi: 3.1.0
info:
  title: Impressipes API
  version: 0.1.0
  description: Source of truth for the Go server, the web app and the iOS app.
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: The signed-in member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /members:
    get:
      operationId: listMembers
      responses:
        "200":
          description: Every family member
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /members/{id}/disable:
    post:
      operationId: disableMember
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204": { description: Member disabled and their sessions revoked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /members/{id}/enable:
    post:
      operationId: enableMember
      parameters:
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204": { description: Member re-enabled }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /invites:
    post:
      operationId: createInvite
      description: Issue a single-use invite link. Pass memberId to re-invite an existing member.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                memberId: { type: string }
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                type: object
                required: [token, path]
                properties:
                  token: { type: string }
                  path: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /invites/{token}:
    get:
      operationId: getInvite
      security: []
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: Invite state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteInfo" }
        "404":
          description: No such invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteInfo" }
  /invites/{token}/accept:
    post:
      operationId: acceptInvite
      security: []
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color, credentialId]
              properties:
                name: { type: string }
                color: { type: string }
                credentialId: { type: string }
                email:
                  type: string
                  description: Required for a new member; optional on a re-invite. A confirmation link and code are emailed to it; until confirmed it cannot be used to sign in.
                password:
                  type: string
                  description: At least 10 characters. Required for a new member; optional on a re-invite.
      responses:
        "201":
          description: Invite accepted; a session cookie is set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      operationId: login
      description: Sign in with a confirmed email and a password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in; a session cookie is set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/magic:
    post:
      operationId: requestMagicLink
      description: |
        Email a sign-in link and six-digit code to a confirmed address. Always
        answers 202, whether or not the address belongs to a member.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202": { description: "If the address belongs to a member, an email is on its way" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/verify:
    post:
      operationId: verifyMagicLink
      description: |
        Redeem an emailed link (token) or code (email + code). Signs the member in,
        and confirms the address when the email was a confirmation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                email: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Signed in; a session cookie is set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me/email:
    post:
      operationId: setEmail
      description: Email a confirmation link and code to a new address. It becomes the member's email once confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202": { description: Confirmation sent }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me/password:
    put:
      operationId: setPassword
      description: Set or replace the signed-in member's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Password saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/config:
    get:
      operationId: getAuthConfig
      description: What the sign-in screen needs to know about this server before anyone is signed in.
      security: []
      responses:
        "200":
          description: Sign-in options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /auth/passkey/begin:
    post:
      operationId: beginPasskeyLogin
      description: Start signing in with a passkey. Pass `options` to navigator.credentials.get (or ASAuthorizationPlatformPublicKeyCredentialProvider) with no allow list, so the device offers whichever passkey it holds.
      security: []
      responses:
        "200":
          description: A challenge to sign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/passkey/finish:
    post:
      operationId: finishPasskeyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyFinish" }
      responses:
        "200":
          description: Signed in; a session cookie is set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/apple:
    post:
      operationId: signInWithApple
      description: |
        Sign in with an Apple identity token. The Apple ID must already be linked to a
        member, or carry a verified email that matches a member's confirmed email (in
        which case it is linked). Nobody can join this way: joining needs an invite.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppleToken" }
      responses:
        "200":
          description: Signed in; a session cookie is set
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me/sign-in:
    get:
      operationId: getSignInMethods
      description: The passkeys and Apple ID the signed-in member has set up.
      responses:
        "200":
          description: Sign-in methods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignInMethods" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/passkeys/begin:
    post:
      operationId: beginPasskeyRegistration
      description: Start adding a passkey. Pass `options` to navigator.credentials.create (or ASAuthorizationPlatformPublicKeyCredentialProvider).
      responses:
        "200":
          description: A challenge to sign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /me/passkeys/finish:
    post:
      operationId: finishPasskeyRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PasskeyFinish"
                - type: object
                  properties:
                    name:
                      type: string
                      description: A label for the list, such as "iPhone". Defaults to a generic name.
      responses:
        "201":
          description: Passkey saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/passkeys/{passkeyId}:
    delete:
      operationId: deletePasskey
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Passkey removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/apple:
    put:
      operationId: linkApple
      description: Link an Apple ID to the signed-in member, replacing any earlier one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppleToken" }
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppleLink" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unlinkApple
      responses:
        "204": { description: Apple ID unlinked }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /lists:
    get:
      operationId: listLists
      responses:
        "200":
          description: Active lists in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/List" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createList
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListInput" }
      responses:
        "201":
          description: List created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/List" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /lists/{listId}:
    parameters:
      - $ref: "#/components/parameters/ListId"
    get:
      operationId: getList
      responses:
        "200":
          description: The list with its categories and live items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateList
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListPatch" }
      responses:
        "200":
          description: Updated list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/List" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: archiveList
      description: Archives the list; its items are kept.
      responses:
        "204": { description: Archived }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /lists/{listId}/categories:
    parameters:
      - $ref: "#/components/parameters/ListId"
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /lists/{listId}/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/ListId"
      - $ref: "#/components/parameters/CategoryId"
    patch:
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryPatch" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCategory
      description: Deletes the category; its items become uncategorised.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /lists/{listId}/items:
    parameters:
      - $ref: "#/components/parameters/ListId"
    post:
      operationId: createItem
      description: >
        Adds an item. The client may supply the id so an offline retry is idempotent.
        A missing category or quantity is filled from the list's item memory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemInput" }
      responses:
        "201":
          description: Item created or, on a retry, returned unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /lists/{listId}/suggestions:
    parameters:
      - $ref: "#/components/parameters/ListId"
    get:
      operationId: suggestItems
      description: Autocomplete from what the household has added to this list before.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Up to eight suggestions, most used first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Suggestion" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    patch:
      operationId: updateItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ItemPatch" }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteItem
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /sync:
    get:
      operationId: pullSync
      description: >
        Item changes (including deletions) after a version. Start with since=0 and
        store the returned version for the next pull.
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Changes since the given version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncChanges" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: pushSync
      description: >
        Applies a batch of offline operations in order. Every operation is idempotent
        on its item id, so a retried batch is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/SyncOp" }
      responses:
        "200":
          description: Per-operation outcomes and the version after the batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /recipes:
    get:
      operationId: listRecipes
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Matches title, summary, ingredients and tags.
        - name: tag
          in: query
          schema: { type: string }
        - name: mark
          in: query
          description: Only recipes the signed-in member has marked this way.
          schema: { $ref: "#/components/schemas/RecipeMark" }
      responses:
        "200":
          description: Recipe summaries, A to Z
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecipeSummary" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "201":
          description: Recipe created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /recipes/{recipeId}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      operationId: getRecipe
      responses:
        "200":
          description: The full recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      operationId: replaceRecipe
      description: Replaces the recipe, including its ingredients, steps and tags.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeInput" }
      responses:
        "200":
          description: Updated recipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recipe" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteRecipe
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /recipes/{recipeId}/images:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    post:
      operationId: uploadRecipeImage
      summary: Add a photo to a recipe
      description: >
        Multipart upload with one `file` part: JPEG, PNG, GIF or WebP, up to 10 MB
        and 25 megapixels, at most 12 photos per recipe. The server stores a
        thumbnail and a large variant as WebP. The variants are fetched with
        `GET /images/{imageId}/thumb` and `/large` (not in this document: they
        return image bytes, are auth-checked by the session cookie and carry
        long-lived cache headers).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: The stored image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /recipes/{recipeId}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
      - name: imageId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteRecipeImage
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /recipes/{recipeId}/marks/{mark}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
      - name: mark
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RecipeMark" }
    put:
      operationId: markRecipe
      responses:
        "204": { description: Marked for the signed-in member }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unmarkRecipe
      responses:
        "204": { description: Mark removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tags:
    get:
      operationId: listTags
      responses:
        "200":
          description: Every tag in use
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /lists/{listId}/add-recipe:
    parameters:
      - $ref: "#/components/parameters/ListId"
    post:
      operationId: addRecipeToList
      description: >
        Adds a recipe's ingredients to the list, scaled to the requested servings.
        Ingredients already on the list are merged into the existing item, and each
        new item is categorised from the list's item memory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipeId]
              properties:
                recipeId: { type: string }
                servings: { type: number, format: double, minimum: 0 }
      responses:
        "200":
          description: What changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddRecipeResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /lists/{listId}/activity:
    parameters:
      - $ref: "#/components/parameters/ListId"
    get:
      operationId: listActivity
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /activity:
    get:
      operationId: listAllActivity
      summary: Household activity feed, newest first
      description: >
        Every audited change across lists and recipes. Filter by person, client
        (web, ios, watch, or mcp for any AI client), type of change and date.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: userId, in: query, schema: { type: string } }
        - { name: via, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityFeed" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /activity/{activityId}/undo:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    post:
      operationId: undoActivity
      summary: Undo one change
      description: >
        Restores the record to how it was before the change and records the undo
        as a new activity row. Answers 409 when a later change touched the same
        record, unless force is true.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UndoInput" }
      responses:
        "200":
          description: The new undo row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /activity/batches/{batchId}/undo:
    parameters:
      - name: batchId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: undoActivityBatch
      summary: Undo every change one AI request made
      description: >
        All-or-nothing: when any row in the batch conflicts with a later change
        (and force is not true) nothing is undone and the answer is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UndoInput" }
      responses:
        "200":
          description: The new undo rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
security:
  - session: []
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: impressipies_session
  parameters:
    MemberId:
      name: id
      in: path
      required: true
      schema: { type: string }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { type: string }
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema: { type: string }
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Member:
      type: object
      required: [id, name, color, role, status]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
        role: { type: string, enum: [admin, member] }
        status: { type: string, enum: [active, disabled] }
        email:
          type: string
          description: The confirmed email, if the member has one.
        hasPassword: { type: boolean }
        setup:
          $ref: "#/components/schemas/SetupStatus"
          description: Only on /me. What is left on the getting-started checklist.
    AuthConfig:
      type: object
      required: [passkeys]
      properties:
        passkeys: { type: boolean, description: Passkey sign-in is available. }
        appleClientId:
          type: string
          description: The Services ID for Sign in with Apple on the web. Absent when the web button is off.
    PasskeyCeremony:
      type: object
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          description: Send back with the finished credential. Single use, valid for five minutes.
        options:
          type: object
          additionalProperties: true
          description: |
            The WebAuthn PublicKeyCredentialCreationOptions or RequestOptions, wrapped
            as `{ "publicKey": ... }` in the JSON form browsers accept: base64url
            strings for every binary field.
    PasskeyFinish:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId: { type: string }
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential the authenticator produced, in WebAuthn JSON form (base64url binary fields).
    Passkey:
      type: object
      required: [id, name, createdAt, synced]
      properties:
        id: { type: string, description: The base64url credential id. }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        synced:
          type: boolean
          description: The passkey is backed up and available on the member's other devices, such as through iCloud Keychain.
    AppleToken:
      type: object
      required: [identityToken, nonce]
      properties:
        identityToken: { type: string, description: The JWT Apple returned. }
        nonce:
          type: string
          description: The random value the client generated. Its SHA-256 (hex) must have been sent to Apple as the request nonce.
    AppleLink:
      type: object
      properties:
        email: { type: string, description: The address on the Apple ID, which may be a private relay. }
    SignInMethods:
      type: object
      required: [passkeys]
      properties:
        passkeys:
          type: array
          items: { $ref: "#/components/schemas/Passkey" }
        apple:
          $ref: "#/components/schemas/AppleLink"
          description: Present when an Apple ID is linked.
    SetupStatus:
      type: object
      required: [appConnected, aiConnected]
      properties:
        pendingEmail:
          type: string
          description: An address waiting for its confirmation code, if any.
        appConnected:
          type: boolean
          description: The iOS or watch app has signed in as this member.
        aiConnected:
          type: boolean
          description: An assistant holds an active connector grant or personal token.
    InviteInfo:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [valid, used, expired, disabled, invalid] }
        reinvite: { type: boolean }
        name: { type: string }
        color: { type: string }
    List:
      type: object
      required: [id, name, emoji, colour, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        emoji: { type: string }
        colour: { type: string }
        sortOrder: { type: integer }
    ListInput:
      type: object
      required: [name, colour]
      properties:
        name: { type: string }
        emoji: { type: string }
        colour: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CategoryInput" }
    ListPatch:
      type: object
      properties:
        name: { type: string }
        emoji: { type: string }
        colour: { type: string }
        sortOrder: { type: integer }
    ListDetail:
      allOf:
        - $ref: "#/components/schemas/List"
        - type: object
          required: [categories, items]
          properties:
            categories:
              type: array
              items: { $ref: "#/components/schemas/Category" }
            items:
              type: array
              items: { $ref: "#/components/schemas/Item" }
    Category:
      type: object
      required: [id, listId, name, colour, icon, sortOrder]
      properties:
        id: { type: string }
        listId: { type: string }
        name: { type: string }
        colour: { type: string }
        icon: { type: string }
        sortOrder: { type: integer }
    CategoryInput:
      type: object
      required: [name, colour]
      properties:
        name: { type: string }
        colour: { type: string }
        icon: { type: string }
    CategoryPatch:
      type: object
      properties:
        name: { type: string }
        colour: { type: string }
        icon: { type: string }
        sortOrder: { type: integer }
    Item:
      type: object
      required: [id, listId, name, quantityText, note, checked, addedBy, position, version, updatedAt, deleted]
      properties:
        id: { type: string }
        listId: { type: string }
        categoryId: { type: string }
        name: { type: string }
        quantityText: { type: string }
        note: { type: string }
        checked: { type: boolean }
        checkedBy: { type: string }
        addedBy: { type: string }
        sourceRecipeId: { type: string }
        position: { type: integer }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
        deleted: { type: boolean }
    ItemInput:
      type: object
      required: [name]
      properties:
        id: { type: string, description: Client-generated UUID. }
        name: { type: string }
        quantityText: { type: string }
        note: { type: string }
        categoryId: { type: string }
    ItemPatch:
      type: object
      properties:
        name: { type: string }
        quantityText: { type: string }
        note: { type: string }
        categoryId: { type: string, description: Empty string clears the category. }
        checked: { type: boolean }
        position: { type: integer }
    Suggestion:
      type: object
      required: [name, quantityText]
      properties:
        name: { type: string }
        quantityText: { type: string }
        categoryId: { type: string }
    SyncChanges:
      type: object
      required: [version, items]
      properties:
        version: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/Item" }
    SyncOp:
      type: object
      required: [type, itemId]
      properties:
        type: { type: string, enum: [upsert, check, uncheck, delete] }
        itemId: { type: string }
        listId: { type: string, description: Required for upsert. }
        item: { $ref: "#/components/schemas/ItemInput" }
    SyncResult:
      type: object
      required: [version, results]
      properties:
        version: { type: integer, format: int64 }
        results:
          type: array
          items:
            type: object
            required: [itemId, status]
            properties:
              itemId: { type: string }
              status: { type: string, enum: [applied, not_found, invalid] }
    RecipeMark:
      type: string
      enum: [favourite, want_to_make]
    Ingredient:
      type: object
      required: [item]
      properties:
        section: { type: string }
        quantity: { type: number, format: double }
        unit: { type: string }
        item: { type: string }
        prepNote: { type: string }
        rawText: { type: string }
    Step:
      type: object
      required: [text]
      properties:
        text: { type: string }
        timerSeconds: { type: integer, minimum: 1 }
    RecipeInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        summary: { type: string }
        servings: { type: number, format: double }
        prepMinutes: { type: integer, minimum: 0 }
        cookMinutes: { type: integer, minimum: 0 }
        sourceUrl: { type: string }
        sourceKind: { type: string, enum: [url, photo, manual, ai] }
        notes: { type: string }
        tags:
          type: array
          items: { type: string }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/Ingredient" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/Step" }
    RecipeSummary:
      type: object
      required: [id, title, summary, sourceKind, tags, marks, createdBy, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        servings: { type: number, format: double }
        prepMinutes: { type: integer }
        cookMinutes: { type: integer }
        sourceKind: { type: string }
        tags:
          type: array
          items: { type: string }
        marks:
          type: array
          description: The signed-in member's marks.
          items: { $ref: "#/components/schemas/RecipeMark" }
        createdBy: { type: string }
        updatedAt: { type: string, format: date-time }
        coverUrl:
          type: string
          description: Thumbnail of the first photo, relative to the API root
    Recipe:
      allOf:
        - $ref: "#/components/schemas/RecipeSummary"
        - type: object
          required: [notes, ingredients, steps, images]
          properties:
            images:
              type: array
              items: { $ref: "#/components/schemas/Image" }
            sourceUrl: { type: string }
            notes: { type: string }
            ingredients:
              type: array
              items: { $ref: "#/components/schemas/Ingredient" }
            steps:
              type: array
              items: { $ref: "#/components/schemas/Step" }
    Image:
      type: object
      required: [id, thumbUrl, largeUrl]
      properties:
        id: { type: string }
        thumbUrl: { type: string, description: "Relative to the API root, e.g. /images/{id}/thumb" }
        largeUrl: { type: string }
    AddRecipeResult:
      type: object
      required: [added, merged]
      properties:
        added:
          type: array
          items: { $ref: "#/components/schemas/Item" }
        merged:
          type: array
          items: { $ref: "#/components/schemas/Item" }
    Activity:
      type: object
      required: [id, via, action, detail, createdAt, undoable]
      properties:
        id: { type: integer, format: int64 }
        userId: { type: string }
        via: { type: string }
        action: { type: string }
        listId: { type: string }
        recipeId: { type: string }
        batchId: { type: string, description: One AI request; rows sharing it undo together }
        detail:
          type: object
          additionalProperties: true
          description: Includes before (and after, for edits) so the feed can show what changed
        createdAt: { type: string, format: date-time }
        undoable: { type: boolean, description: Can still be undone }
        restorableUntil: { type: string, format: date-time, description: When the undo window closes }
        undoneAt: { type: string, format: date-time }
        undoneBy: { type: string }
        undoOf: { type: integer, format: int64, description: Set on the row an undo created }
    ActivityFeed:
      type: array
      items: { $ref: "#/components/schemas/Activity" }
    UndoInput:
      type: object
      properties:
        force:
          type: boolean
          description: Overwrite a later change to the same record
